services:
  nas:
    build: .
    restart: unless-stopped
    init: true
    user: "${NAS_UID:-1000}:${NAS_GID:-1000}"
    ports:
      - "${NAS_BIND_IP:-127.0.0.1}:${NAS_PORT:-8080}:8080"
    environment:
      NAS_MAX_UPLOAD_BYTES: "${NAS_MAX_UPLOAD_BYTES:-10737418240}"
      NAS_SESSION_SECONDS: "${NAS_SESSION_SECONDS:-604800}"
      NAS_SECURE_COOKIE: "${NAS_SECURE_COOKIE:-false}"
    volumes:
      - type: bind
        source: "${NAS_FILES_PATH:-./data/files}"
        target: /data/files
        bind:
          create_host_path: false
      - type: bind
        source: "${NAS_APP_PATH:-./data/app}"
        target: /data/app
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
